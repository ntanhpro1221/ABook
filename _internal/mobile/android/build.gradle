// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        // Giao diện native (docs/NATIVE_PHONE_UI.md): bộ biên dịch Compose đi cùng bản Kotlin; profile khởi động; ảnh chụp màn bằng Roborazzi.
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1' // 1.5.0 làm :app:compileBenchmarkReleaseKotlin hỏng ("Could not stat ...provider(?)")
        classpath 'io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.77.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
