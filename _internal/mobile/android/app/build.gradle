apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Khoá ký bản phát hành (docs/RELEASING.md): nằm NGOÀI repo - %USERPROFILE%\.abook-keys\android-release.properties (storeFile,
// storePassword, keyAlias, keyPassword; ABOOK_ANDROID_SIGNING trỏ chỗ khác) - không bao giờ commit. Mọi bản cập nhật APK
// phải cùng khoá này, nên chủ sách giữ bản sao. Thiếu file thì bản release KHÔNG ký, không bao giờ rơi về khoá debug.
def releaseSigning = new Properties()
def releaseSigningFile = new File(System.getenv("ABOOK_ANDROID_SIGNING") ?: "${System.getProperty('user.home')}/.abook-keys/android-release.properties")
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace = "vn.abook.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ngdtuanh.abook"
        // Bài đo trên điện thoại thật (scripts/supertonic_phone_bench.sh): -PbenchAppId=<tên khác> cài bản thử dưới gói riêng, không bao giờ
        // thay hay xoá app thật của người dùng.
        if (project.hasProperty("benchAppId")) {
            applicationId project.property("benchAppId")
        }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 52
        versionName "0.4.50"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Loa giả DLNA (FakeRenderer) dùng chung cho bài thử JVM (DlnaTest) và bài thử trên máy Android (DlnaOnDeviceTest).
    sourceSets {
        test.java.srcDirs += "src/sharedTest/java"
        androidTest.java.srcDirs += "src/sharedTest/java"
        // Luật chọn danh sách phát đóng kèm app (playlist_picker.json): MỘT file của máy tính (abook/webui/assets), điện thoại đọc đúng file ấy
        // như asset (DeviceMusic.bundledPicker); test JVM / máy Android so với bộ ví dụ tests/fixtures/playlist_picker.
        main.assets.srcDirs += "../../../abook/webui/assets"
        androidTest.assets.srcDirs += "../../../tests/fixtures/playlist_picker"
        // Mp3 + số vàng của bộ phân tích nhạc (tests/music_student_goldens.py) dùng chung với pytest; bài thử trên máy Android đọc từ assets.
        androidTest.assets.srcDirs += "../../../tests/fixtures/music_student"
        // Số của máy tính cho giọng VieNeu (scripts/vieneu_android_fixtures.py): VieneuOnDeviceTest so phoneme + clip trên máy thật.
        androidTest.assets.srcDirs += "../../../tests/fixtures/vieneu/android"
        // "Xuất MP3" (tests/mp3_export_fixtures.py): Mp3ExportOnDeviceTest so tag điện thoại ghi với file ffmpeg của máy tính.
        androidTest.assets.srcDirs += "../../../tests/fixtures/mp3_export"
        // Ba đoạn đo tốc độ giọng Supertonic (scripts/supertonic_bench.py đọc cùng file): SupertonicBenchTest.
        androidTest.assets.srcDirs += "../../../tests/fixtures/readaloud/supertonic"
    }
    signingConfigs {
        if (releaseSigning.getProperty("storeFile")) {
            release {
                storeFile new File(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            // R8: thu nhỏ mã + tài nguyên (APK nhỏ hơn). Luật giữ ở proguard-rules.pro; mapping.txt phải cất lại sau mỗi bản
            // phát hành (docs/RELEASING.md), không có nó thì stack trace của bản thu nhỏ không đọc được.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning.getProperty("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    // Thông báo Studio (StudioAlerts.kt): hỏi máy tính mỗi 15 phút cả khi app đã đóng.
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    // Bộ phân tích nhạc chạy trên máy (MusicStudent.kt, OrtClapTower.kt) dùng ONNX Runtime CPU, nhưng APK KHÔNG mang nó: phần Java chép
    // nguyên vào src/main/java/ai/onnxruntime (MIT, onnxruntime-android 1.30.0), còn thư viện native + model tải về khi người dùng bấm
    // "Gói nhạc" (OrtRuntime.kt, MusicStudentSetup.kt) - APK không có file .so nào.
    // Kiểm chữ ký Ed25519 (Signatures.kt - danh mục nhạc, cấu hình từ xa): minSdk 24 chưa có Ed25519 trong java.security. Tink: APK release +1,0 MB
    // (eddsa 0.3.0 chỉ +24 KB); luật đã duyệt: Tink khi tăng không quá 3 MB.
    implementation "com.google.crypto.tink:tink-android:1.23.0"
    testImplementation "junit:junit:$junitVersion"
    // org.json thật cho test JVM (android.jar chỉ có vỏ rỗng): StoreRekeyTest đọc/ghi records.json, book.json.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
