apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'androidx.baselineprofile'
apply plugin: 'io.github.takahirom.roborazzi'

// Khoá ký bản phát hành (docs/RELEASING.md): nằm NGOÀI repo - %USERPROFILE%\.abook-keys\android-release.properties (storeFile,
// storePassword, keyAlias, keyPassword; ABOOK_ANDROID_SIGNING trỏ chỗ khác) - không bao giờ commit. Mọi bản cập nhật APK
// phải cùng khoá này, nên chủ sách giữ bản sao. Thiếu file thì bản release KHÔNG ký, không bao giờ rơi về khoá debug.
def releaseSigning = new Properties()
def releaseSigningFile = new File(System.getenv("ABOOK_ANDROID_SIGNING") ?: "${System.getProperty('user.home')}/.abook-keys/android-release.properties")
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace = "vn.abook.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ngdtuanh.abook"
        // Bài đo trên điện thoại thật (scripts/supertonic_phone_bench.sh): -PbenchAppId=<tên khác> cài bản thử dưới gói riêng, không bao giờ
        // thay hay xoá app thật của người dùng.
        if (project.hasProperty("benchAppId")) {
            applicationId project.property("benchAppId")
        }
        // Chế độ sách giả cho đo đạc (NativeActivity.DEMO_BOOKS) chỉ có ở bản thử dưới gói riêng: Activity mở app nhận Intent của mọi app khác,
        // nên bản phát hành không bao giờ nghe extra ấy.
        buildConfigField "boolean", "DEMO", "${project.hasProperty("benchAppId")}"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 151
        versionName "0.4.149"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // App chỉ có tiếng Việt (res/values) và muốn chữ của media3 cũng tiếng Việt cả khi máy để tiếng Anh (strings.xml). Thư viện media3 mang theo
    // values-en-rGB / en-rAU / en-rIN: trên máy đặt các vùng ấy, bản dịch cụ thể hơn của thư viện thắng chữ Việt mặc định của app. Chỉ giữ "vi" của thư viện;
    // tài nguyên mặc định luôn được giữ.
    androidResources {
        localeFilters += ["vi"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Cài đặt > Giới thiệu > "Thành phần sử dụng" đọc docs/THIRD_PARTY.md: chép thành asset lúc build (nativeThirdPartyAsset).
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir("generated/thirdPartyAssets").get().asFile
    testOptions {
        // Robolectric (ảnh chụp màn bằng Roborazzi) cần tài nguyên gộp của app.
        unitTests.includeAndroidResources = true
    }
    // Loa giả DLNA (FakeRenderer) dùng chung cho bài thử JVM (DlnaTest) và bài thử trên máy Android (DlnaOnDeviceTest).
    sourceSets {
        test.java.srcDirs += "src/sharedTest/java"
        androidTest.java.srcDirs += "src/sharedTest/java"
        // Hằng số trộn nhạc (music_mix.json) và tên giọng máy khác (voice_labels.json): MỘT file của máy tính (abook/webui/assets), điện thoại đọc đúng file ấy như asset (MusicMix, VoiceLabels).
        main.assets.srcDirs += "../../../abook/webui/assets"
        // Mp3 + số vàng của bộ phân tích nhạc (tests/music_student_goldens.py) dùng chung với pytest; bài thử trên máy Android đọc từ assets.
        androidTest.assets.srcDirs += "../../../tests/fixtures/music_student"
        // Số của máy tính cho giọng VieNeu (scripts/vieneu_android_fixtures.py): VieneuOnDeviceTest so phoneme + clip trên máy thật.
        androidTest.assets.srcDirs += "../../../tests/fixtures/vieneu/android"
        // "Xuất MP3" (tests/mp3_export_fixtures.py): Mp3ExportOnDeviceTest so tag điện thoại ghi với file ffmpeg của máy tính.
        androidTest.assets.srcDirs += "../../../tests/fixtures/mp3_export"
        // Ba đoạn đo tốc độ giọng Supertonic (scripts/supertonic_bench.py đọc cùng file): SupertonicBenchTest.
        androidTest.assets.srcDirs += "../../../tests/fixtures/readaloud/supertonic"
    }
    signingConfigs {
        if (releaseSigning.getProperty("storeFile")) {
            release {
                storeFile new File(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            // R8: thu nhỏ mã + tài nguyên (APK nhỏ hơn). Luật giữ ở proguard-rules.pro; mapping.txt phải cất lại sau mỗi bản
            // phát hành (docs/RELEASING.md), không có nó thì stack trace của bản thu nhỏ không đọc được.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning.getProperty("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    jvmToolchain(21)
}

composeCompiler {
    // Soát độ ổn định: gradlew -PcomposeReports ... -> app/build/compose_reports (docs/NATIVE_PHONE_UI.md §3).
    if (project.hasProperty("composeReports")) {
        reportsDestination = layout.buildDirectory.dir("compose_reports")
        metricsDestination = layout.buildDirectory.dir("compose_reports")
    }
}

roborazzi {
    // Ảnh chuẩn của màn native nằm trong repo: record = -Proborazzi.test.record=true, verify = tác vụ verifyRoborazziDebug.
    outputDir.set(layout.projectDirectory.dir("src/test/snapshots"))
}

baselineProfile {
    // Profile sinh bằng :baselineprofile trên máy (generateBaselineProfile), cất ở src/main/generated/baselineProfiles và gộp vào bản release.
    automaticGenerationDuringBuild = false
    dexLayoutOptimization = true
}

dependencies {
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    // Thông báo Studio (StudioAlerts.kt): hỏi máy tính mỗi 15 phút cả khi app đã đóng.
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    // Bộ phân tích nhạc chạy trên máy (MusicStudent.kt, OrtClapTower.kt) dùng ONNX Runtime CPU, nhưng APK KHÔNG mang nó: phần Java chép
    // nguyên vào src/main/java/ai/onnxruntime (MIT, onnxruntime-android 1.30.0), còn thư viện native + model tải về khi người dùng bấm
    // "Gói nhạc" (OrtRuntime.kt, MusicStudentSetup.kt) - APK không có file .so nào.
    // Kiểm chữ ký Ed25519 (Signatures.kt - danh mục nhạc, cấu hình từ xa): minSdk 24 chưa có Ed25519 trong java.security. Tink: APK release +1,0 MB
    // (eddsa 0.3.0 chỉ +24 KB); luật đã duyệt: Tink khi tăng không quá 3 MB.
    implementation "com.google.crypto.tink:tink-android:1.24.0"
    // Giao diện native (docs/NATIVE_PHONE_UI.md §2): chỉ ui + foundation + animation - KHÔNG material; thành phần tự vẽ. Không DI, không thư viện ảnh, không navigation-compose.
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleComposeVersion"
    implementation "androidx.profileinstaller:profileinstaller:$profileInstallerVersion"
    // Soát chuyển cảnh bằng Perfetto (NATIVE_PERF_PROGRESS.md): -PcomposeTrace đưa tên từng composable vào trace (bật bằng broadcast, xem tracing-perfetto).
    // Chỉ khi có cờ; bản thường và bản benchmark mặc định không mang thư viện này.
    if (project.hasProperty("composeTrace")) {
        implementation "androidx.compose.runtime:runtime-tracing:$composeRuntimeTracingVersion"
        implementation "androidx.tracing:tracing-perfetto:$tracingPerfettoVersion"
        implementation "androidx.tracing:tracing-perfetto-binary:$tracingPerfettoVersion"
    }
    baselineProfile project(":baselineprofile")
    testImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazziVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:$roborazziVersion"
    debugImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "junit:junit:$junitVersion"
    // org.json thật cho test JVM (android.jar chỉ có vỏ rỗng): StoreRekeyTest đọc/ghi records.json, book.json.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Robolectric tự tải android-all bằng HTTP riêng (hỏng khi DNS / tường lửa chập chờn): để Gradle tải, Robolectric đọc offline từ thư mục này.
// 15-robolectric-13954326-i7 là jar SDK 35 mà Robolectric 4.17 dùng (đổi Robolectric thì đổi theo; test báo tên jar thiếu).
configurations {
    robolectricJars
}
dependencies {
    robolectricJars "org.robolectric:android-all-instrumented:15-robolectric-13954326-i7"
}
def robolectricDir = layout.buildDirectory.dir("robolectric-jars")
tasks.register("prepareRobolectricJars", Copy) {
    from configurations.robolectricJars
    into robolectricDir
}
tasks.withType(Test).configureEach {
    dependsOn "prepareRobolectricJars"
    systemProperty "robolectric.offline", "true"
    systemProperty "robolectric.dependency.dir", robolectricDir.get().asFile.path
}

def thirdPartyAsset = tasks.register("nativeThirdPartyAsset", Copy) {
    from "../../../docs/THIRD_PARTY.md"
    into layout.buildDirectory.dir("generated/thirdPartyAssets")
}
tasks.named("preBuild").configure { dependsOn thirdPartyAsset }
