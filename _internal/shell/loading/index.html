<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>ABook</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { --bg: #f5f3ef; --text: #1a1814; color-scheme: light; }
      [data-theme="dark"] { --bg: #121110; --text: #ece8e1; color-scheme: dark; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121110; --text: #ece8e1; color-scheme: dark; } }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
    </style>
  </head>
