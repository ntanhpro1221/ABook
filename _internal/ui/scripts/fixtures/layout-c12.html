<!doctype html><meta charset="utf-8"><style>
body{font:16px Arial;margin:20px;background:#fff;color:#111}button{border:0;background:transparent}section{width:300px;margin-bottom:16px}select{height:40px} [role=menu]{position:absolute;background:#fff;color:#111;border:1px solid #999;padding:0;box-sizing:border-box} [role=menuitem]{position:absolute;width:80px;height:30px}
</style>
<section><select id="select-bad" data-select-layout="column" style="width:150px"><option>Cuốn sách</option></select></section>
<section><select id="select-good" data-select-layout="column" style="width:100%"><option>Cuốn sách</option></select></section>
<section><select id="select-inline" data-select-layout="inline" style="width:100px"><option>22:00</option></select></section>
<button id="outline-bad" style="border:1px solid #999">Chọn thư mục</button><button id="outline-tab" style="border-bottom:2px solid #999">Tab</button><button id="outline-input" role="switch" style="border:1px solid #999">Bật</button>
<div style="margin-top:20px"><img id="image-good" width="20" height="20" alt="Ảnh"><img id="image-bad" style="width:20px;height:20px" alt="Ảnh"></div>
<div data-remote-status="compact" style="margin-top:20px"><span id="remote-good" data-remote-progress>42%</span></div>
<div data-remote-status="compact"><span id="remote-bad" data-remote-progress style="padding-left:12px">42%</span></div>
<div role="menu" data-side="bottom" style="left:20px;top:400px;width:100px;height:100px"><button id="bad-trigger" role="menuitem" style="left:10px;top:50px">Mở</button></div>
<div id="submenu-bad" role="menu" data-side="right" data-submenu-trigger="bad-trigger" style="left:124px;top:450px;width:100px;height:100px">Sai</div>
<div role="menu" data-side="bottom" style="left:20px;top:600px;width:100px;height:100px"><button id="good-trigger" role="menuitem" style="left:10px;top:50px">Mở</button></div>
<div id="submenu-good" role="menu" data-side="right" data-submenu-trigger="good-trigger" style="left:128px;top:600px;width:100px;height:100px">Đúng</div>
<div data-sonner-toast style="margin-top:700px;width:100px"><span data-title>Toàn bộ tiêu đề dài của thông báo đều được xuống dòng</span></div>
