<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:12px;font:14px/1.5 Arial;background:white;color:black}section{margin:8px 0}
.surface{padding:20px;background:#f5f5f5;width:340px}h2{font:700 20px Arial;margin:0 0 8px}button{font:inherit;color:inherit;border:0;background:transparent}svg{width:16px;height:16px;stroke:black;stroke-width:2;fill:none}
.row{display:flex;align-items:center;justify-content:space-between;width:340px;height:36px;padding:0}.pad{padding:0 12px;background:#ddd;border-radius:8px}.bad{padding:0;background:#ddd}.menu{width:340px;background:#eee}.menu button{display:flex;align-items:center;height:36px;width:100%}
</style><body>
<section id="sheet-bad" role="dialog" class="surface"><h2>Giọng đọc</h2><div class="sheet-body"><div style="padding-left:3.5px">Trực tuyến</div><button class="row" style="padding-left:11px">Thêm giọng</button><div style="padding-left:21px">Dấu trang</div></div></section>
<section id="sheet-good" role="dialog" class="surface"><h2>Giọng đọc</h2><div class="sheet-body"><div>Trực tuyến</div><button class="row">Thêm giọng</button><div>Dấu trang</div></div></section>
<section id="chevron-bad"><button class="row">Thiết bị<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></section>
<section id="chevron-good"><button class="row">Thiết bị<svg style="translate:3.333333px 0" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></section>
<section id="fill-good"><button class="pad" style="height:36px">Giọng đọc</button><button class="pad" style="height:36px"><span style="display:block;width:60px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">Giọng đọc có tên rất dài</span></button></section>
<section id="fill-bad"><button class="bad" style="height:36px">Giọng đọc</button></section>
<section id="selection-bad" style="display:flex;width:340px"><button aria-pressed="true" class="pad" style="flex:1">Giọng đọc</button><button style="width:60px">Thử</button></section>
<section id="selection-good" style="display:flex;width:340px;background:#ddd;padding:0 12px"><button aria-pressed="true" style="flex:1;text-align:left">Giọng đọc</button><button>Thử</button></section>
<section id="menu-bad" class="menu" role="menu"><button role="menuitem">Tốc độ</button><button role="menuitem" style="height:42px">Hẹn giờ</button><button role="menuitem">Giọng đọc</button></section>
<section id="menu-good" class="menu" role="menu"><button role="menuitem">Tốc độ</button><button role="menuitem">Hẹn giờ</button><button role="menuitem">Giọng đọc</button></section>
</body></html>
