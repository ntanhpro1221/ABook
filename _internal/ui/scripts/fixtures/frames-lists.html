<!doctype html><meta charset="utf-8"><style>
body{font:16px Arial;margin:24px;background:#fff;color:#111}section{margin-bottom:24px}.card{border:1px solid #888;border-radius:12px;padding:16px}.line{border-bottom:1px solid #888;padding:8px 0}.fill{background:#ddd;padding:8px}.bleed{margin:0 -8px}.field{display:flex;border:1px solid #888;border-radius:8px;height:40px}input{min-width:0}button{border:1px solid #888;border-radius:8px;padding:8px}
</style>
<section class="card" id="nested-bad"><div class="card">Carte dans carte</div></section>
<section role="dialog" aria-label="Dialog" class="card" id="dialog-bad"><div class="card">Carte dans dialogue</div></section>
<section role="dialog" aria-label="Dialog" class="card" id="dialog-good"><div>Section plane</div><div class="field"><input aria-label="Champ"></div><button>Bouton</button></section>
<section class="card" id="single-good">Surface indépendante</section>
<section data-list-edges="bad" id="list-bad"><div class="line bleed">Vạch thừa</div><button class="fill bleed" style="width:calc(100% + 16px)">Nền thừa</button></section>
<section data-list-edges="good" id="list-good"><div class="line">Vạch gọn</div><button class="fill" style="width:100%">Nền gọn</button></section>
<ul id="inline-good"><li>Câu có <mark style="padding:0 2px">từ</mark> được tô.</li><li>Một câu dài hơn có <mark style="padding:0 2px">từ</mark> được tô.</li></ul>
<h2 id="heading-good" data-section-title style="font-size:18px;font-weight:500;text-transform:none">Tiêu đề mục</h2>
<h2 id="heading-bad" data-section-title style="font-size:12px;font-weight:600;text-transform:uppercase">Tiêu đề lệch</h2>
<div data-choice-grid><button id="choice-good" style="border:0;background:transparent">15 phút</button><button id="choice-bad" style="background:#ddd">30 phút</button></div>
<div role="dialog" aria-label="Đệm đúng" class="motion-dialog" id="padding-good" style="padding:24px">Nội dung</div>
<div role="dialog" aria-label="Đệm sai" class="motion-dialog" id="padding-bad" style="padding:21px">Nội dung</div>
<div data-sonner-toast id="toast-good"><span data-title>Đã thêm sách</span><button data-button>Quay lại</button></div>
<div data-sonner-toast id="toast-bad" style="width:120px"><span data-title>Thông báo dài cần mở trong phần chi tiết</span><button data-button>Thử lại</button><button data-button>Đóng</button></div>
