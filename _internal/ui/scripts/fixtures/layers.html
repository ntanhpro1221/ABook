<!doctype html><html lang="vi"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:white;color:#181818}
.cases{display:grid;gap:12px;padding:20px}.stackcase{grid-column:1/-1;position:relative;height:120px;font-size:13px}.stackcase>div{position:absolute;background:#fff;border:1px solid #888;padding:6px}
</style><div class="cases">
<div id="stacked" class="stackcase"><div role="dialog" aria-label="Sửa sách" style="left:0;top:0;width:160px;height:100px">Sửa sách</div><div role="dialog" aria-label="Tìm ảnh bìa" style="left:40px;top:30px;width:160px;height:80px">Tìm ảnh bìa</div></div>
<div id="stacked-menu" class="stackcase"><div role="menu" aria-label="Menu" style="left:0;top:20px;width:150px;height:90px">Nhạc nền</div><div role="dialog" aria-label="Nhạc" style="left:20px;top:0;width:150px;height:60px">Để máy chọn</div></div>
<div id="stacked-pass" class="stackcase"><div role="dialog" aria-label="Hộp" style="left:0;top:0;width:200px;height:110px">Hộp<div role="menu" aria-label="Chọn" style="position:absolute;left:20px;top:30px;width:100px;height:50px;background:#eee">Mục</div></div><div role="menu" aria-label="Cha" style="left:210px;top:0;width:100px;height:60px">Cha</div><div role="menu" aria-label="Con" style="left:306px;top:0;width:100px;height:60px">Con</div></div>
</div></html>
