<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- "Thêm vào màn hình chính" (iPhone, iPad, Android qua trình duyệt): mở như app, không thanh địa chỉ. Màu thanh theo
         giao diện (--bg trong styles.css). Cổng đồng bộ phục vụ riêng các file này cho cả trình duyệt chưa ghép (remote_studio.PUBLIC_STATIC). -->
    <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <script>
      // The native shell reads preferences.json before creating the webview. Browsers follow the OS until preferences arrive.
      document.documentElement.dataset.theme = window.__ABOOK_BOOT_THEME__ || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <style>
      html { background: #f5f3ef; color: #1a1814; color-scheme: light; }
      html[data-theme="dark"] { background: #121110; color: #ece8e1; color-scheme: dark; }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ABook" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>ABook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
